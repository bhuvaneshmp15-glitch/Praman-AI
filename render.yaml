services:
  - type: web
    name: praman-api
    runtime: python
    plan: free
    rootDir: praman-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn praman_api.main:app --app-dir src --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
