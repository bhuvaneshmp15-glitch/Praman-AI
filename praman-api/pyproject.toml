[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praman-api"
version = "0.1.0"
description = "Autonomous B2B Financial Reconciliation & Cash-Flow Protection Engine for Indian SMEs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "google-genai>=0.1.0",
    "rapidfuzz>=3.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "faker>=24.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
